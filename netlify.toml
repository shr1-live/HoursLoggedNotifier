# This file must live at the repository root - Netlify only reads netlify.toml
# from there. "base" then moves the build into web/, so npm runs against the
# React app rather than the repository root, which holds the .NET project.
# "publish" is resolved relative to base, so it means web/dist.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: unknown paths must return index.html rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response.
#
# The app makes no network requests of its own and stores everything in the
# visitor's own localStorage, so almost everything can be denied outright.
# The one relaxation is style-src 'unsafe-inline': React and Recharts set
# style attributes on elements, which CSP counts as inline styles. That
# permits styling, not script execution, so it does not weaken the XSS
# protection that script-src provides.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Stops the site being framed, so it cannot be used for clickjacking.
    X-Frame-Options = "DENY"
    # Stops the browser guessing a content type different from the one sent.
    X-Content-Type-Options = "nosniff"
    # Never leak the URL to third parties.
    Referrer-Policy = "no-referrer"
    # The app needs none of these, so deny them rather than leave them available.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    # HTTPS only from now on. Deliberately without "preload", which is
    # effectively irreversible once submitted.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Isolate this origin from any other page that opens it.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Asset filenames carry a content hash, so they can be cached indefinitely.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    # The entry point must revalidate, or a deploy never reaches returning users.
    Cache-Control = "no-cache"
